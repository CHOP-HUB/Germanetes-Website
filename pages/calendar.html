<section class="events-calendar" aria-labelledby="calendar-heading">
    <div class="calendar-topline">
        <h2 id="calendar-heading" data-i18n="calendar.header">Calendari d'activitats</h2>
        <div class="calendar-controls" aria-label="Calendar navigation">
            <button type="button" class="calendar-control" id="calendar-previous" aria-label="Previous month">&#8592;</button>
            <button type="button" class="calendar-control calendar-today" id="calendar-today" data-i18n="calendar.today">Avui</button>
            <button type="button" class="calendar-control" id="calendar-next" aria-label="Next month">&#8594;</button>
        </div>
    </div>

    <div class="calendar-month-row">
        <h3 class="calendar-month-title" id="calendar-month-title"></h3>
        <div class="calendar-legend" id="calendar-legend" aria-label="Event categories"></div>
    </div>

    <p class="calendar-status" id="calendar-status" role="status" aria-live="polite"></p>

    <div class="calendar-scroll" tabindex="0" aria-label="Monthly events calendar">
        <div class="calendar-board" id="calendar-board" role="grid" aria-labelledby="calendar-month-title"></div>
    </div>

    <aside class="calendar-event-detail" id="calendar-event-detail" hidden aria-live="polite">
        <button type="button" class="calendar-detail-close" id="calendar-detail-close" aria-label="Close event details">&times;</button>
        <p class="calendar-detail-date" id="calendar-detail-date"></p>
        <h3 id="calendar-detail-title"></h3>
        <p id="calendar-detail-time"></p>
        <p id="calendar-detail-location"></p>
        <p class="calendar-detail-description" id="calendar-detail-description"></p>
    </aside>
</section>
