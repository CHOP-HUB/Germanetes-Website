<section class="events-calendar" aria-labelledby="calendar-month-title">
    <div class="bulletin-layout">
        <div class="bulletin-column">
            <div class="bulletin-heading">
                <div class="calendar-controls" aria-label="Calendar navigation">
                    <button type="button" class="calendar-control" id="calendar-previous" aria-label="Previous month"><svg viewBox="0 0 12 16" width="12" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1" ><path d="M9.14 1L1.5 8l7.64 7"/></svg></button>
                    <button type="button" class="calendar-control calendar-today" id="calendar-today" data-i18n="calendar.today">mes actual</button>
                    <button type="button" class="calendar-control" id="calendar-next" aria-label="Next month"><svg viewBox="0 0 12 16" width="12" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1" ><path d="M2.86 1l7.64 7-7.64 7"/></svg></button>
                </div>
                <h2 class="calendar-month-title" id="calendar-month-title"></h2>
            </div>
            <figure class="bulletin-page">
                <img id="bulletin-image" alt="" hidden>
                <p class="bulletin-empty" id="bulletin-empty" data-i18n="calendar.noBulletin" hidden></p>
            </figure>
        </div>
    </div>
</section>
